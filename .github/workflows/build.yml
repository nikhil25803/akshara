name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: make docker-build IMAGE=akshara TAG=ci
      - name: Start container
        run: docker run --detach --name akshara-ci --publish 8000:8000 --env ENABLE_LLM=false akshara:ci
      - name: Smoke test
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health > /tmp/akshara-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs akshara-ci
              exit 1
            fi
            sleep 1
          done

          python -c 'import json; assert json.load(open("/tmp/akshara-health.json")) == {"status": "ok"}'
          curl --fail --silent --show-error http://127.0.0.1:8000/ | python -c 'import json, sys; assert json.load(sys.stdin)["features"]["llm"] is False'
      - name: Stop container
        if: always()
        run: docker rm --force akshara-ci
