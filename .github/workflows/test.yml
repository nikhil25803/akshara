name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked
      - name: Verify PaddleOCR package
        run: uv run python -c "import paddleocr"
      - name: Install and verify PaddlePaddle runtime
        if: runner.os == 'Linux'
        run: uv sync --locked --extra ocr && uv run python -c "import paddle; import paddleocr"
      - name: Verify local key generator
        if: runner.os == 'Linux'
        shell: bash
        run: |
          key="$(make generate-key | tail -n 1)"
          test "${#key}" -ge 32
      - name: Run checks
        run: uv run ruff check . && uv run ruff format --check . && uv run pytest
