name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if not match:
              raise SystemExit(f"Release tag must be vMAJOR.MINOR.PATCH, got {tag}")
          release_version = match.group(1)

          project = tomllib.loads(Path("pyproject.toml").read_text())
          project_version = project["project"]["version"]
          package_text = Path("src/akshara/__init__.py").read_text()
          package_match = re.search(
              r'^__version__ = "([^"]+)"$', package_text, re.MULTILINE
          )
          package_version = package_match.group(1) if package_match else None
          if project_version != release_version or package_version != release_version:
              raise SystemExit(
                  "Tag, pyproject.toml, and package versions must match: "
                  f"{tag=}, {project_version=}, {package_version=}"
              )

          changelog = Path("CHANGELOG.md").read_text()
          heading = re.search(
              rf"^## \[{re.escape(release_version)}\] - \d{{4}}-\d{{2}}-\d{{2}}$",
              changelog,
              re.MULTILINE,
          )
          if not heading:
              raise SystemExit(
                  f"CHANGELOG.md needs a dated [{release_version}] section"
              )
          next_heading = re.search(
              r"^(?:## |\[[^]]+\]:)",
              changelog[heading.end() :],
              re.MULTILINE,
          )
          end = (
              heading.end() + next_heading.start()
              if next_heading
              else len(changelog)
          )
          notes = changelog[heading.end() : end].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md section [{release_version}] is empty")
          Path("/tmp/release-notes.md").write_text(notes + "\n")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"version={release_version}\n")

      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks
        run: make check

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md
          fi
