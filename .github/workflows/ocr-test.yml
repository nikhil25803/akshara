name: OCR Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/ocr-check.sh"
      - ".github/workflows/ocr-test.yml"
      - "assets/test/**"
      - "src/**"
      - "Dockerfile"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/scripts/ocr-check.sh"
      - ".github/workflows/ocr-test.yml"
      - "assets/test/**"
      - "src/**"
      - "Dockerfile"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  ocr-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_KEY: ci-only-api-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: make docker-build IMAGE=akshara TAG=ocr-test

      - name: Start server
        run: |
          echo "OCR_TEST_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          docker run --detach --name akshara-ocr-test --publish 8000:8000 \
            --env API_KEY --env ENABLE_LLM=false --env OCR_LANGUAGES=en \
            akshara:ocr-test

      - name: Check health
        id: health
        shell: bash
        run: |
          set -uo pipefail

          health_started=$SECONDS
          ready=false
          health_code="000"

          for ((attempt = 1; attempt <= 120; attempt++)); do
            health_code="$(
              curl --silent --max-time 5 \
                --output /tmp/akshara-health.json \
                --write-out "%{http_code}" \
                http://127.0.0.1:8000/health 2>/dev/null || true
            )"
            if [ "$health_code" = "200" ] && python3 -c \
              'import json; data=json.load(open("/tmp/akshara-health.json")); assert data == {"status": "ok", "paddleocr": True}'; then
              ready=true
              break
            fi
            sleep 2
          done

          readiness_seconds=$((SECONDS - health_started))
          {
            echo "## OCR endpoint test"
            echo
            echo "- Server ready: **${ready}**"
            echo "- Health HTTP status: **${health_code}**"
            echo "- Server readiness time: **${readiness_seconds}s**"
            echo
            echo "| Fixture | HTTP | MIME type | Extraction source | Pages | Characters | Warnings | Duration | Result |"
            echo "| --- | ---: | --- | --- | ---: | ---: | ---: | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ready" != "true" ]; then
            exit 1
          fi

      - name: OCR JPEG
        id: jpeg
        continue-on-error: true
        run: >-
          bash .github/scripts/ocr-check.sh JPEG
          assets/test/driving-licence.jpg image/jpeg paddleocr

      - name: OCR PNG
        id: png
        continue-on-error: true
        run: >-
          bash .github/scripts/ocr-check.sh PNG
          assets/test/quote.png image/png paddleocr

      - name: OCR PDF
        id: pdf
        continue-on-error: true
        run: >-
          bash .github/scripts/ocr-check.sh PDF
          assets/test/NikhilRaj_Resume_SDE.pdf application/pdf embedded_text

      - name: Summarize result
        if: always()
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          JPEG_OUTCOME: ${{ steps.jpeg.outcome }}
          PNG_OUTCOME: ${{ steps.png.outcome }}
          PDF_OUTCOME: ${{ steps.pdf.outcome }}
        run: |
          now="$(date +%s)"
          started="${OCR_TEST_STARTED:-$now}"
          total_seconds=$((now - started))

          {
            echo
            echo "- Health result: **${HEALTH_OUTCOME}**"
            echo "- JPEG result: **${JPEG_OUTCOME}**"
            echo "- PNG result: **${PNG_OUTCOME}**"
            echo "- PDF result: **${PDF_OUTCOME}**"
            echo "- Total staged test time: **${total_seconds}s**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HEALTH_OUTCOME" = "success" ] \
            && [ "$JPEG_OUTCOME" = "success" ] \
            && [ "$PNG_OUTCOME" = "success" ] \
            && [ "$PDF_OUTCOME" = "success" ]; then
            echo "- Overall result: **Passed**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Overall result: **Failed**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Show server logs on failure
        if: failure()
        run: docker logs akshara-ocr-test || true

      - name: Stop server
        if: always()
        run: docker rm --force akshara-ocr-test || true
