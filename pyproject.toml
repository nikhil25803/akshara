[project]
name = "akshara"
version = "0.0.1"
description = "Akshara is an open-source, local-first document intelligence engine built with Python. It aims to turn images and PDFs into structured data and useful answers using OCR and optional LLMs."
readme = "README.md"
authors = [
    { name = "Nikhil", email = "nikhil25803@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.4.3",
    "paddleocr>=3.3,<4",
    "pillow>=12.1.1",
    "pydantic-settings>=2.16.1",
    "pymupdf>=1.27.2.2",
    "python-multipart>=0.0.22",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle==3.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
akshara = "akshara.main:run"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[[tool.uv.index]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle" }
